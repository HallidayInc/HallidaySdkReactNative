<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Halliday SDK React Native Demo</title>
</head>
<body>
  <div id="app">
    <div id="connect-section" class="halliday-container">
      <h1>Halliday SDK React Native Demo</h1>
      <button id="btn-connect">Connect Wallet</button>
    </div>

    <div id="halliday-section" class="halliday-container hidden">
      <button id="btn-restart">Disconnect</button>
      <button id="btn-deposit" disabled>Deposit with Halliday</button>
      <button id="btn-withdraw" disabled>Withdraw</button>
      <button id="btn-activity" disabled>Activity</button>
      <div id="status-text"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
